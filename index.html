<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A shopping cart sorted with a natural-language comparator."
    />
    <title>AI Lambda Cart Sorter</title>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">AI Lambda</p>
        <h1>Cart sorter</h1>
        <p class="intro">
          Items are sorted by line price, highest first, with natural
          alphabetical ordering for ties.
        </p>
      </header>
      <section aria-labelledby="cart-heading">
        <div class="section-heading">
          <h2 id="cart-heading">Shopping cart</h2>
          <p>Sorted by total line price</p>
        </div>
        <div class="table-wrap">
          <table id="cart" aria-describedby="cart-heading">
            <thead>
              <tr>
                <th scope="col">Product</th>
                <th scope="col">Category</th>
                <th scope="col">Quantity</th>
                <th scope="col">Unit price</th>
                <th scope="col">Line total</th>
                <th scope="col">Added</th>
                <th scope="col">Availability</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
